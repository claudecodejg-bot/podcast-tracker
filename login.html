<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Pod Tracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">🎙️ <span>Pod</span>Tracker</a>
  <ul class="nav-links"></ul>
  <div class="nav-right">
    <button id="nav-auth-btn" class="hidden"></button>
  </div>
</nav>

<main>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <h1>🎙️ Pod Tracker</h1>
        <p id="login-subtitle">Sign in to access your library</p>
      </div>

      <div id="login-alert" class="alert hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
      </form>

      <p style="margin-top:0.75rem;text-align:center;">
        <button id="forgot-btn" style="background:none;border:none;color:var(--accent);font-size:0.85rem;cursor:pointer;text-decoration:underline;padding:0;">
          Forgot password?
        </button>
      </p>

      <form id="reset-form" class="hidden" style="margin-top:1rem;">
        <div class="form-group">
          <label for="reset-email">Your email address</label>
          <input type="email" id="reset-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="reset-btn">Send Reset Email</button>
        <p style="margin-top:0.5rem;text-align:center;">
          <button id="back-btn" type="button" style="background:none;border:none;color:var(--gray-600);font-size:0.85rem;cursor:pointer;text-decoration:underline;padding:0;">
            Back to sign in
          </button>
        </p>
      </form>

      <!-- Shown when arriving from a password-reset / invite email link -->
      <form id="new-password-form" class="hidden" style="margin-top:1rem;">
        <div class="form-group">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="new-password-btn">Set Password</button>
      </form>

      <p style="margin-top:1rem;font-size:0.82rem;color:var(--gray-600);text-align:center;">
        Don't have an account? Contact your group admin.
      </p>
    </div>
  </div>
</main>

<footer>Pod Tracker &copy; <span id="footer-year"></span></footer>

<script type="module">
  // Capture the URL hash BEFORE creating the Supabase client — it consumes
  // (and strips) recovery/invite tokens from the URL as it initializes.
  const arrivalHash = new URLSearchParams(window.location.hash.slice(1))
  let recoveryMode  = ['recovery', 'invite'].includes(arrivalHash.get('type'))

  const { supabase }                 = await import('./js/supabase-client.js')
  const { getSession, ensureUserRow } = await import('./js/auth.js')

  document.getElementById('footer-year').textContent = new Date().getFullYear()

  const alertEl       = document.getElementById('login-alert')
  const loginForm     = document.getElementById('login-form')
  const resetForm     = document.getElementById('reset-form')
  const newPassForm   = document.getElementById('new-password-form')
  const subtitleEl    = document.getElementById('login-subtitle')

  function showAlert(msg, type = 'error') {
    alertEl.textContent = msg
    alertEl.className = `alert alert-${type}`
    alertEl.classList.remove('hidden')
  }

  /** Human-friendly message for a sign-in failure. */
  function signInErrorMessage(error) {
    // No HTTP status → the request never reached Supabase (offline, DNS,
    // or the free-tier project is paused and needs a dashboard Restore).
    if (!error.status) {
      return "Can't reach the server right now — it may be waking up. Try again in a minute, and tell your group admin if it keeps happening."
    }
    if (error.status === 400) return 'Incorrect email or password. Please try again.'
    return `Sign-in failed (${error.status}). Please try again, or contact your group admin.`
  }

  function showNewPasswordForm() {
    loginForm.classList.add('hidden')
    resetForm.classList.add('hidden')
    newPassForm.classList.remove('hidden')
    subtitleEl.textContent = 'Choose a password for your account'
  }

  // Belt-and-braces: supabase-js fires this after it processes a recovery link.
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryMode = true
      showNewPasswordForm()
    }
  })

  if (recoveryMode) {
    // Arrived from a reset/invite email — let them set a password.
    // Do NOT auto-redirect: the link created a session, but no password yet.
    showNewPasswordForm()
  } else if (arrivalHash.get('error_description')) {
    // Expired or already-used email link
    showAlert('That link has expired. Use "Forgot password?" below to get a new one.')
  } else {
    getSession().then(session => {
      if (session) window.location.href = 'library.html'
    })
  }

  newPassForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    const password = document.getElementById('new-password').value
    const confirm  = document.getElementById('confirm-password').value
    if (password !== confirm) {
      showAlert("Those passwords don't match.")
      return
    }

    const btn = document.getElementById('new-password-btn')
    btn.disabled = true
    btn.textContent = 'Saving…'

    const { data, error } = await supabase.auth.updateUser({ password })
    if (error) {
      showAlert(error.message || 'Could not set password. The link may have expired — use "Forgot password?" to get a new one.')
      btn.disabled = false
      btn.textContent = 'Set Password'
      return
    }

    const session = await getSession()
    if (session) await ensureUserRow(session)
    showAlert('Password set! Taking you to your library…', 'success')
    window.location.href = 'library.html'
  })

  document.getElementById('forgot-btn').addEventListener('click', () => {
    loginForm.classList.add('hidden')
    resetForm.classList.remove('hidden')
    alertEl.classList.add('hidden')
    document.getElementById('login-subtitle').textContent = 'Reset your password'
  })

  document.getElementById('back-btn').addEventListener('click', () => {
    resetForm.classList.add('hidden')
    loginForm.classList.remove('hidden')
    alertEl.classList.add('hidden')
    document.getElementById('login-subtitle').textContent = 'Sign in to access your library'
  })

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    alertEl.classList.add('hidden')
    const btn = document.getElementById('login-btn')
    btn.disabled = true
    btn.textContent = 'Signing in…'

    const email    = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value

    const { data, error } = await supabase.auth.signInWithPassword({ email, password })

    if (error) {
      showAlert(signInErrorMessage(error))
      btn.disabled = false
      btn.textContent = 'Sign In'
      return
    }

    if (data.session) await ensureUserRow(data.session)
    window.location.href = 'library.html'
  })

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    const btn = document.getElementById('reset-btn')
    btn.disabled = true
    btn.textContent = 'Sending…'

    const email = document.getElementById('reset-email').value.trim()
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname.replace('login.html', '') + 'login.html'
    })

    if (error) {
      showAlert(`Could not send reset email: ${error.message || 'unknown error'}. If this keeps happening, contact your group admin.`)
    } else {
      showAlert('Reset email sent! Check your inbox.', 'success')
    }
    btn.disabled = false
    btn.textContent = 'Send Reset Email'
  })
</script>
</body>
</html>
