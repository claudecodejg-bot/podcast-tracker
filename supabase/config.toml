[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://claudecodejg-bot.github.io/podcast-tracker"
additional_redirect_urls = [
  "https://claudecodejg-bot.github.io/podcast-tracker/*",
  "http://127.0.0.1:8079/*",   # local dev preview
  "http://localhost:8079/*",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false   # invite-only: create users via dashboard

[auth.email]
# NOTE: this flag maps to the remote "Email provider" toggle — setting it
# false disables ALL email/password auth (sign-in + recovery), not just
# signups. Public signup is already blocked by auth.enable_signup above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.search-podcasts]
verify_jwt = false

[functions.parse-url]
verify_jwt = false

[functions.add-podcast]
verify_jwt = true

[functions.refresh-episodes]
verify_jwt = true

[functions.generate-summary]
verify_jwt = true
